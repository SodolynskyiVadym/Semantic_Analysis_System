<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ClientApp</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ClientApp.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.audioPlayer = {
            seekTo: function (element, timeInSeconds) {
                if (element) {
                    var parsedTime = parseFloat(timeInSeconds.toString().replace(',', '.'));
                    element.currentTime = parsedTime;
                    element.play();
                }
            }
        };
    </script>

    <script>
        window.blazorDownloadFile = function (fileName, contentType, byteBase64) {
            var link = document.createElement('a');
            link.download = fileName;
            link.href = "data:" + contentType + ";base64," + byteBase64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>

</html>
