version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    restart: always

  database:
    image: postgres:15
    container_name: postgres-server
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Test1234
      - POSTGRES_DB=semantic_analysis_db
    ports:
      - "5432:5432"  
    volumes:
      - ./database/db_data:/var/lib/postgresql/data
    restart: always
  

  stt:
    build:
      context: ./stt
    container_name: stt-module
    environment:
      - ENV=DockerEnv
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=password
      - DB_CONNECTION_STRING=postgresql://postgres:Test1234@database:5432/semantic_analysis_db
      - AUDIO_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - rabbitmq
      - database